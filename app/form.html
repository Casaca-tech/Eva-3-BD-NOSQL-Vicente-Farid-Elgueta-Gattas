<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/">Gestión de Usuarios</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/index.html">Usuarios</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="/form.html">Registrar Usuario</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/canciones.html">Canciones Favoritas</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-center mt-4 mb-4">Registro de Usuario</h1>
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 formulario">
                <form id="formularioRegistro" onsubmit="event.preventDefault(); validarFormulario();">
                    <!-- Nombre -->
                    <div class="form-group">
                        <label for="inputNombre">Nombre Completo</label>
                        <input type="text" class="form-control" id="inputNombre" name="nombre" placeholder="Ingrese su nombre completo" required>
                    </div>

                    <div class="form-group">
                        <label for="inputRut">RUT (con dígito verificador)</label>
                        <input type="text" class="form-control" id="inputRut" name="rut" placeholder="Ej: 12345678-5" required>
                    </div>

                    <div class="form-group">
                        <label for="inputEmail">Correo Electrónico</label>
                        <input type="email" class="form-control" id="inputEmail" name="correo" placeholder="correo@ejemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="inputTelefono">Teléfono</label>
                        <input type="text" class="form-control" id="inputTelefono" name="telefono" placeholder="Ej: 912345678">
                    </div>

                    <div class="form-group">
                        <label for="inputFechaNacimiento">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" id="inputFechaNacimiento" name="fechaNacimiento" required>
                    </div>

                    <div class="form-group">
                        <label for="selectNacionalidad">Nacionalidad (Código ISO-3166)</label>
                        <select class="form-control" id="selectNacionalidad" name="nacionalidad" required>
                            <option value="">Seleccione un país...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="selectGenero">Género</label>
                        <select class="form-control" id="selectGenero" name="genero">
                            <option value="">Seleccione...</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="O">Otro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="inputComuna">Comuna</label>
                        <input type="text" class="form-control" id="inputComuna" name="comuna" placeholder="Comuna" required>
                    </div>
                    <div class="form-group">
                        <label for="inputCalle">Calle</label>
                        <input type="text" class="form-control" id="inputCalle" name="calle" placeholder="Calle" required>
                    </div>
                    <div class="form-group">
                        <label for="inputNumero">Número</label>
                        <input type="text" class="form-control" id="inputNumero" name="numero" placeholder="Número">
                    </div>
                    <div class="form-group">
                        <label for="inputDepartamento">Departamento/Oficina</label>
                        <input type="text" class="form-control" id="inputDepartamento" name="departamento" placeholder="Depto. u Oficina (opcional)">
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="contrasena" placeholder="Mínimo 8 caracteres" required>
                        <small id="passwordHelp" class="form-text text-muted">Debe tener entre 8 y 15 caracteres, incluir mayúscula, minúscula, número y un carácter especial.</small>
                    </div>

                    <div class="form-group">
                        <label for="passwordRepetir">Repetir Contraseña</label>
                        <input type="password" class="form-control" id="passwordRepetir" placeholder="Repita su contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="/form.js"></script>
</body>
</html>
