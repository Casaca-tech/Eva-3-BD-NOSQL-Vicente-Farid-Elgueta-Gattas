<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Canciones Favoritas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Estilos del proyecto -->
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="/">Gestión de Usuarios</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/index.html">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/form.html">Registrar Usuario</a>
                </li>
                <li class="nav-item active">
                    <a class="nav-link" href="/canciones.html">Canciones Favoritas</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="text-center mb-4">Mis Canciones Favoritas</h1>
        <div class="table-responsive">
            <table id="tablaCanciones" class="table table-striped table-bordered" style="width:100%">
                <thead>
                    <tr>
                        <th>Usuario (Nombre)</th>
                        <th>Título</th>
                        <th>Artista</th>
                        <th>Álbum</th>
                        <th>Género</th>
                        <th>Duración (min)</th>
                        <th>Año</th>
                        <th>Idioma</th>
                        <th>Plataforma</th>
                        <th>Favorita</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>


    <script>
        $(document).ready(function() {
            obtenerCanciones(); // Llamamos a la función para obtener las canciones
        });

        function obtenerCanciones() {
            $.ajax({
                url: 'http://localhost:3000/obtenerCanciones',
                type: 'GET',
                dataType: 'json',
                success: function(data) {
                    console.log('Datos de canciones recibidos:', data);
                    inicializarDataTable(data);
                },
                error: function(error) {
                    console.error('Error al obtener las canciones:', error);
                    alert('Hubo un error al cargar las canciones.');
                }
            });
        }

        function inicializarDataTable(canciones) {
            if ($.fn.DataTable.isDataTable('#tablaCanciones')) {
                $('#tablaCanciones').DataTable().destroy();
            }

            $('#tablaCanciones').DataTable({
                data: canciones,
                columns: [
                    { 
                        data: 'usuario',
                        render: function(data) {
                            return data ? data.nombre : 'Usuario no encontrado';
                        }
                    },
                    { data: 'titulo' },
                    { data: 'artista' },
                    { data: 'album' },
                    { data: 'genero' },
                    { 
                        data: 'duracion',
                        render: function(data) {
                            if (!data) return '';
                            const minutos = Math.floor(data / 60);
                            const segundos = data % 60;
                            return `${minutos}:${segundos < 10 ? '0' : ''}${segundos}`;
                        }
                    },
                    { data: 'anio' },
                    { data: 'idioma' },
                    { data: 'plataforma' },
                    { 
                        data: 'favorita',
                        render: function(data) {
                            return data ? 'Sí' : 'No';
                        }
                    }
                ],
                order: [[1, 'asc']], // Ordenar por título por defecto
                language: {
                    url: '//cdn.datatables.net/plug-ins/1.13.4/i18n/es-ES.json'
                }
            });
        }
    </script>

</body>
</html>
